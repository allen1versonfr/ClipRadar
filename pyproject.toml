# Lint settings only: Clip Radar isn't installed as a package (it runs from src/ and is frozen with
# PyInstaller). CI runs `ruff check` with these rules; they catch real mistakes (undefined names,
# unused imports and variables, syntax errors, mutable default arguments, duplicate set items),
# not style.
[tool.ruff]
target-version = "py312"
line-length = 130
extend-exclude = ["src/stubs"]

[tool.ruff.lint]
select = ["E9", "F", "B006", "B012", "B033", "PLE"]

[tool.ruff.lint.per-file-ignores]
# the e2e driver returns from `finally` on purpose: a failed check must still write its report
"tests/e2e.py" = ["B012"]
