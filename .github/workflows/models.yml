name: Build model files

# Builds the laughter / scream / cheer detector (src/models/audio_events.onnx)
# and publishes it on the "models-v1" pre-release, where the app build and
# source installs download it from. Run it by hand from the Actions tab, or by
# pushing to the build-models branch.
on:
  workflow_dispatch:
  push:
    branches: [build-models]

permissions:
  contents: write

jobs:
  audio-events:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          python -m pip install -U pip
          python -m pip install torch==2.5.1 torchaudio==2.5.1 torchvision==0.20.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx onnxruntime "numpy<2.3"
      - name: Export and check
        run: |
          git clone --depth 1 https://github.com/fschmid56/EfficientAT /tmp/EfficientAT
          set +e
          python scripts/export_audio_model.py --efficientat /tmp/EfficientAT --out "$RUNNER_TEMP/model" > "$RUNNER_TEMP/export.log" 2>&1
          code=$?
          set -e
          tail -c 6000 "$RUNNER_TEMP/export.log"
          # logs can't always be downloaded, so put the important part in annotations
          msg=$(grep -v "^ *(" "$RUNNER_TEMP/export.log" | grep -v "^ *[A-Za-z]*(" | tail -25 | tr '\n' '|' | sed 's/%/%25/g')
          if [ $code -ne 0 ]; then echo "::error title=export failed::$msg"; exit 1; fi
          echo "::notice title=export report::$(tr '\n' ' ' < "$RUNNER_TEMP/model/audio_events_report.json")"
      - name: Publish on the models-v1 pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd "$RUNNER_TEMP/model"
          if ! gh release view models-v1 >/dev/null 2>&1; then
            gh release create models-v1 --prerelease --title "Model files" --target "${{ github.sha }}" \
              --notes "Model files VodClipper downloads at build time. Not an app release; get VodClipper from the latest release."
          fi
          gh release upload models-v1 audio_events.onnx audio_events_test.npz audio_events_report.json --clobber
