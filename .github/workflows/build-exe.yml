name: Build VodClipper.exe

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: python -m pip install -U pip && python -m pip install -r requirements.txt pywebview pyinstaller

      - name: Get ffmpeg, TwitchDownloader and yt-dlp
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          python tools_setup.py --dest tools ffmpeg twitchdownloader ytdlp
          foreach ($t in "ffmpeg.exe","ffprobe.exe","TwitchDownloaderCLI.exe","yt-dlp.exe") {
            if (-not (Test-Path "tools\$t")) { Write-Host "::error title=FAIL tool download::$t missing"; exit 1 }
          }

      - name: Build exe
        run: >
          python -m PyInstaller --noconfirm --clean --log-level WARN --onedir --windowed
          --name VodClipper --icon ui/icon.ico --add-data "ui;ui"
          --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime
          --collect-all av --collect-all webview --collect-submodules yt_dlp --collect-data certifi
          --hidden-import clr --hidden-import tkinter --hidden-import tkinter.filedialog
          app.py

      - name: Add tools and readme
        shell: pwsh
        run: |
          Copy-Item tools dist/VodClipper/tools -Recurse -Force
          Copy-Item README.txt dist/VodClipper/README.txt

      - name: Make a test stream (video + spoken words)
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          try {
            Add-Type -AssemblyName System.Speech
            $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
            $s.Rate = -1
            $s.SetOutputToWaveFile("$t\speech.wav")
            $s.Speak("No way, he just did that. Chat, clip it right now. That was absolutely insane.")
            $s.Dispose()
          } catch { Write-Host "::warning title=speech::Speech synthesis unavailable: $_" }
          if (Test-Path "$t\speech.wav") { Write-Host "::notice title=speech::$((Get-Item "$t\speech.wav").Length) bytes of test speech" }
          $ff = "tools\ffmpeg.exe"
          if (Test-Path "$t\speech.wav") {
            & $ff -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=60" -f lavfi -i "anoisesrc=color=pink:amplitude=0.01:duration=60" -i "$t\speech.wav" `
              -filter_complex "[2:a]adelay=30000|30000,volume=3[s];[1:a][s]amix=inputs=2:normalize=0[a]" `
              -map 0:v -map "[a]" -t 60 -c:v libx264 -preset ultrafast -c:a aac "$t\test.mp4"
          } else {
            & $ff -v error -y -f lavfi -i "testsrc2=size=1280x720:rate=30:duration=60" -f lavfi -i "sine=frequency=300:duration=60" `
              -t 60 -c:v libx264 -preset ultrafast -c:a aac "$t\test.mp4"
          }
          Get-Item "$t\test.mp4" | Format-List Name, Length

      - name: Self-test inside the exe
        shell: pwsh
        run: |
          $t = $env:RUNNER_TEMP
          $env:VODCLIPPER_WORK = "$t\vc-work"
          $p = Start-Process dist/VodClipper/VodClipper.exe -ArgumentList "--selftest", "$t\selftest.json", "$t\test.mp4" -PassThru
          if (-not $p.WaitForExit(900000)) { Stop-Process -Id $p.Id -Force; Write-Host "::error title=selftest::timed out" }
          Get-Content "$env:LOCALAPPDATA\VodClipper\vodclipper.log" -ErrorAction SilentlyContinue | Select-Object -Last 60
          if (-not (Test-Path "$t\selftest.json")) { Write-Host "::error title=selftest::no report written"; exit 1 }
          $r = Get-Content "$t\selftest.json" -Raw | ConvertFrom-Json
          $passed = ($r.checks | Where-Object { $_.ok } | ForEach-Object { $_.name }) -join ", "
          Write-Host "::notice title=Passed ($(@($r.checks | Where-Object { $_.ok }).Count) of $($r.checks.Count))::$passed"
          foreach ($c in $r.checks) {
            $d = ($c.detail -replace "`r?`n", " | ")
            if (-not $c.ok) { Write-Host "::error title=FAIL $($c.name)::$d" }
            elseif ($c.name -match "captions|title|render|analyze|encoder|yt-dlp|Twitch") { Write-Host "::notice title=$($c.name)::$d" }
          }
          if (-not $r.ok) { exit 1 }

      - name: Smoke test (app server starts)
        shell: pwsh
        run: |
          $env:VODCLIPPER_WORK = "$env:RUNNER_TEMP\vc-work"
          $p = Start-Process dist/VodClipper/VodClipper.exe -ArgumentList "--browser" -PassThru
          $ok = $false
          foreach ($i in 1..40) {
            Start-Sleep 2
            try { $r = Invoke-RestMethod http://127.0.0.1:7860/api/status; if ($r.version) { $ok = $true; break } } catch {}
          }
          if ($ok) {
            $page = (Invoke-WebRequest http://127.0.0.1:7860/ -UseBasicParsing).Content
            Write-Host "::notice title=OK app server::status $($r | ConvertTo-Json -Compress); page $($page.Length) bytes"
            Invoke-RestMethod -Method Post http://127.0.0.1:7860/api/quit -Body '{}' -ContentType 'application/json' | Out-Null
          }
          Start-Sleep 3; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "::error title=FAIL app server::did not start"; exit 1 }

      - name: End-to-end test (live clipping + TikTok posting)
        shell: pwsh
        run: |
          python tests/e2e.py --app "dist/VodClipper/VodClipper.exe" --ffmpeg tools/ffmpeg.exe --out "$env:RUNNER_TEMP\e2e.json" --model tiny
          $code = $LASTEXITCODE
          if (-not (Test-Path "$env:RUNNER_TEMP\e2e.json")) { Write-Host "::error title=e2e::no report"; exit 1 }
          $r = Get-Content "$env:RUNNER_TEMP\e2e.json" -Raw | ConvertFrom-Json
          $passed = @($r.checks | Where-Object { $_.ok })
          Write-Host "::notice title=E2E passed ($($passed.Count) of $($r.checks.Count))::$(($passed | ForEach-Object { $_.name }) -join ', ')"
          foreach ($c in $r.checks) {
            $d = ($c.detail -replace "`r?`n", " | ")
            if (-not $c.ok) { Write-Host "::error title=FAIL $($c.name)::$d" }
            elseif ($c.name -match "moment|titles|direct post|drafts|encrypted|auto-render") { Write-Host "::notice title=$($c.name)::$d" }
          }
          if ($code -ne 0 -and $r.diag) {
            foreach ($p in $r.diag.PSObject.Properties) {
              $txt = (@($p.Value) -join " || ") -replace "`r?`n", " || "
              if ($txt.Length -gt 3500) { $txt = $txt.Substring($txt.Length - 3500) }
              Write-Host "::warning title=diag: $($p.Name)::$txt"
            }
          }
          exit $code

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          if (-not (Test-Path $iscc)) { $iscc = (Get-Command ISCC.exe -ErrorAction Stop).Source }
          $ver = (Select-String -Path server.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$ver" installer.iss
          if (-not (Test-Path dist\VodClipper-Setup.exe)) { Write-Host "::error title=FAIL installer::not built"; exit 1 }
          $mb = [math]::Round((Get-Item dist\VodClipper-Setup.exe).Length / 1MB)
          Write-Host "::notice title=installer::VodClipper-Setup.exe v$ver ($mb MB)"

      - name: Test install and uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $results = [System.Collections.Generic.List[object]]::new()
          function Check($name, $ok, $detail = "") { $results.Add([pscustomobject]@{ name = $name; ok = [bool]$ok; detail = "$detail" }) }
          $app = "$env:LOCALAPPDATA\Programs\VodClipper"
          $data = "$env:LOCALAPPDATA\VodClipper"
          $uninstKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{8E0B5F2A-6C1D-4E8B-9F3A-2D7C1B4A9E10}_is1"
          $startLnk = "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\VodClipper.lnk"
          $deskLnk = Join-Path ([Environment]::GetFolderPath("Desktop")) "VodClipper.lnk"
          Remove-Item Env:VODCLIPPER_WORK -ErrorAction SilentlyContinue

          function Install() {
            Start-Process (Resolve-Path dist\VodClipper-Setup.exe) -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/TASKS=desktopicon" -Wait
          }
          function RunAppAndMakeClip() {
            $p = Start-Process "$app\VodClipper.exe" -ArgumentList "--browser" -PassThru
            $st = $null
            foreach ($i in 1..40) { Start-Sleep 2; try { $st = Invoke-RestMethod http://127.0.0.1:7860/api/storage; break } catch {} }
            $root = $null
            if ($st) {
              $root = $st.workroot
              $proj = Join-Path $root "vod_1"
              New-Item -ItemType Directory -Force "$proj\tiktok" | Out-Null
              '{"title":"t","source":"https://www.twitch.tv/videos/1"}' | Set-Content "$proj\meta.json"
              Set-Content "$proj\tiktok\clip_01.mp4" "fake clip"
              Invoke-RestMethod -Method Post http://127.0.0.1:7860/api/quit -Body '{}' -ContentType 'application/json' | Out-Null
            }
            Start-Sleep 3; Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            return @($st, $root)
          }
          function Uninstall($extra) {
            $ua = @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") + $extra
            Start-Process "$app\unins000.exe" -ArgumentList $ua -Wait
            foreach ($i in 1..60) { if (-not (Test-Path "$app\VodClipper.exe")) { break }; Start-Sleep 2 }
            Start-Sleep 3
          }

          # ---- cycle 1: install, run, uninstall keeping clips (the default)
          Install
          Check "installed exe" (Test-Path "$app\VodClipper.exe") $app
          Check "uninstaller present" (Test-Path "$app\unins000.exe")
          Check "Start menu shortcut" (Test-Path $startLnk)
          Check "Start menu uninstall shortcut" (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Uninstall VodClipper.lnk")
          Check "desktop shortcut" (Test-Path $deskLnk)
          $disp = (Get-ItemProperty $uninstKey -ErrorAction SilentlyContinue).DisplayName
          Check "listed in Settings > Apps" ($disp -eq "VodClipper") $disp
          $st, $root = RunAppAndMakeClip
          Check "installed app runs" ($st -ne $null) "clips folder: $root"
          Check "app sees its uninstaller" ($st.uninstaller -eq $true)
          $reg = (Get-ItemProperty "HKCU:\Software\VodClipper" -ErrorAction SilentlyContinue).ClipsFolder
          Check "clips folder recorded for uninstaller" ($reg -eq $root) $reg
          Uninstall @()
          Check "uninstall removed app" (-not (Test-Path $app))
          Check "uninstall removed app data" (-not (Test-Path $data))
          Check "uninstall removed shortcuts" ((-not (Test-Path $startLnk)) -and (-not (Test-Path $deskLnk)))
          Check "uninstall removed Apps entry" (-not (Test-Path $uninstKey))
          Check "uninstall removed settings key" (-not (Test-Path "HKCU:\Software\VodClipper"))
          Check "uninstall kept clips by default" ($root -and (Test-Path "$root\vod_1\tiktok\clip_01.mp4"))

          # ---- cycle 2: reinstall, uninstall choosing to delete clips too
          Install
          $st, $root = RunAppAndMakeClip
          Uninstall @("/DELETECLIPS=1")
          Check "uninstall can delete clips when asked" ($root -and -not (Test-Path $root)) $root
          Check "second uninstall removed app" (-not (Test-Path $app))

          $passed = @($results | Where-Object { $_.ok })
          Write-Host "::notice title=Install tests passed ($($passed.Count) of $($results.Count))::$(($passed | ForEach-Object { $_.name }) -join ', ')"
          foreach ($r in $results) { if (-not $r.ok) { Write-Host "::error title=FAIL $($r.name)::$($r.detail)" } }
          if ($passed.Count -ne $results.Count) { exit 1 }
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: VodClipper-windows
          path: |
            dist/VodClipper
            dist/VodClipper-Setup.exe

      - name: Publish download (GitHub Release)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Compress-Archive -Path dist/VodClipper -DestinationPath dist/VodClipper-portable.zip -Force
          gh release delete latest --yes --cleanup-tag 2>$null
          $notes = @"
          **VodClipper-Setup.exe** (recommended): installs VodClipper with Start menu and desktop shortcuts. Uninstall it from Settings > Apps, the Start menu, or the Uninstall button in VodClipper.

          **VodClipper-portable.zip**: no install. Unzip anywhere and run VodClipper.exe; delete the folder to remove it.

          Built and tested on Windows from commit ${{ github.sha }}.
          "@
          gh release create latest dist/VodClipper-Setup.exe dist/VodClipper-portable.zip --title "VodClipper for Windows" --notes $notes --target ${{ github.sha }}
          Write-Host "::notice title=OK release::published VodClipper-Setup.exe and VodClipper-portable.zip"
